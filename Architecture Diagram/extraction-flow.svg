<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 1930" role="img" aria-labelledby="title-1" style="background:#fff;font-family:Segoe UI,Arial,sans-serif"><title id="title-1">Extraction graph (LangGraph)</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="990" height="1930" fill="white"/><text x="32" y="35" fill="#0f172a" font-size="22" font-weight="700">Extraction graph (LangGraph)</text><text x="32" y="60" fill="#475569" font-size="13">Green: ingestion | Blue: search | Purple: agents | Orange: interfaces / output</text><path data-from="START" data-to="plan" d="M390.0,168.0 C390.0,225.0 390.0,225.0 390.0,282.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><path data-from="plan" data-to="ingest" d="M390.0,358.0 C390.0,415.0 390.0,415.0 390.0,472.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><path data-from="ingest" data-to="eg" d="M390.0,548.0 C390.0,603.75 390.0,603.75 390.0,659.5" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><circle cx="390.0" cy="603.75" r="12" fill="#fff" stroke="#334155"/><text x="390.0" y="607.75" text-anchor="middle" font-size="12" fill="#0f172a">1</text><path data-from="ingest" data-to="report" d="M390.0,548.0 V573.0 H800 V1207.0 H390.0 V1232.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><circle cx="800" cy="890.0" r="12" fill="#fff" stroke="#334155"/><text x="800" y="894.0" text-anchor="middle" font-size="12" fill="#0f172a">2</text><path data-from="eg" data-to="reconcile" d="M390.0,740.5 C390.0,796.25 390.0,796.25 390.0,852.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><path data-from="reconcile" data-to="validate" d="M390.0,928.0 C390.0,985.0 390.0,985.0 390.0,1042.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><path data-from="validate" data-to="eg" d="M255.0,1080 H45 V700 H255.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><circle cx="53" cy="890.0" r="12" fill="#fff" stroke="#334155"/><text x="53" y="894.0" text-anchor="middle" font-size="12" fill="#0f172a">3</text><path data-from="validate" data-to="report" d="M390.0,1118.0 C390.0,1175.0 390.0,1175.0 390.0,1232.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><circle cx="390.0" cy="1175.0" r="12" fill="#fff" stroke="#334155"/><text x="390.0" y="1179.0" text-anchor="middle" font-size="12" fill="#0f172a">4</text><path data-from="report" data-to="END" d="M390.0,1308.0 C390.0,1365.0 390.0,1365.0 390.0,1422.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><g data-node="START"><title>start</title><rect x="255.0" y="92.0" width="270" height="76" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/><text x="390.0" y="135.0" text-anchor="middle" font-size="14" fill="#172033">start</text></g><g data-node="plan"><title>plan Orchestrator</title><rect x="255.0" y="282.0" width="270" height="76" rx="12" fill="#faf5ff" stroke="#7e22ce" stroke-width="1.5"/><text x="390.0" y="315.5" text-anchor="middle" font-size="14" fill="#172033">plan</text><text x="390.0" y="334.5" text-anchor="middle" font-size="14" fill="#172033">Orchestrator</text></g><g data-node="ingest"><title>ingest Ingestion Agent</title><rect x="255.0" y="472.0" width="270" height="76" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="390.0" y="505.5" text-anchor="middle" font-size="14" fill="#172033">ingest</text><text x="390.0" y="524.5" text-anchor="middle" font-size="14" fill="#172033">Ingestion Agent</text></g><g data-node="eg"><title>extract_group Retrieval Agent + specialist Extraction Agent</title><rect x="255.0" y="659.5" width="270" height="81" rx="12" fill="#faf5ff" stroke="#7e22ce" stroke-width="1.5"/><text x="390.0" y="686.0" text-anchor="middle" font-size="14" fill="#172033">extract_group</text><text x="390.0" y="705.0" text-anchor="middle" font-size="14" fill="#172033">Retrieval Agent +</text><text x="390.0" y="724.0" text-anchor="middle" font-size="14" fill="#172033">specialist Extraction Agent</text></g><g data-node="reconcile"><title>reconcile Addendum Agent</title><rect x="255.0" y="852.0" width="270" height="76" rx="12" fill="#faf5ff" stroke="#7e22ce" stroke-width="1.5"/><text x="390.0" y="885.5" text-anchor="middle" font-size="14" fill="#172033">reconcile</text><text x="390.0" y="904.5" text-anchor="middle" font-size="14" fill="#172033">Addendum Agent</text></g><g data-node="validate"><title>validate Validator/Critic</title><rect x="255.0" y="1042.0" width="270" height="76" rx="12" fill="#faf5ff" stroke="#7e22ce" stroke-width="1.5"/><text x="390.0" y="1075.5" text-anchor="middle" font-size="14" fill="#172033">validate</text><text x="390.0" y="1094.5" text-anchor="middle" font-size="14" fill="#172033">Validator/Critic</text></g><g data-node="report"><title>report Report Agent</title><rect x="255.0" y="1232.0" width="270" height="76" rx="12" fill="#faf5ff" stroke="#7e22ce" stroke-width="1.5"/><text x="390.0" y="1265.5" text-anchor="middle" font-size="14" fill="#172033">report</text><text x="390.0" y="1284.5" text-anchor="middle" font-size="14" fill="#172033">Report Agent</text></g><g data-node="END"><title>end</title><rect x="255.0" y="1422.0" width="270" height="76" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/><text x="390.0" y="1465.0" text-anchor="middle" font-size="14" fill="#172033">end</text></g><text x="32" y="1650" fill="#334155" font-size="14">1. ingest → extract_group: Send x4 (parallel)</text><text x="32" y="1705" fill="#334155" font-size="14">2. ingest → report: ingestion failed</text><text x="32" y="1760" fill="#334155" font-size="14">3. validate → extract_group: failed fields &amp; retries left: Send(extract_group, feedback)</text><text x="32" y="1815" fill="#334155" font-size="14">4. validate → report: done</text></svg>