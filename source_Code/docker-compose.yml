services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./index_store:/app/index_store
      - hf-cache:/root/.cache/huggingface
    command: >
      sh -c "python main.py index data/*/ && python main.py serve --host 0.0.0.0 --port 8000"
  ui:
    build: .
    env_file: .env
    ports: ["8501:8501"]
    depends_on: [api]
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./index_store:/app/index_store
      - hf-cache:/root/.cache/huggingface
    command: streamlit run ui/app.py --server.address 0.0.0.0 --server.port 8501
volumes:
  hf-cache:
