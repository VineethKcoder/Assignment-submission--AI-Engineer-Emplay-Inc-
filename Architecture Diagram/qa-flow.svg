<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 1685" role="img" aria-labelledby="title-2" style="background:#fff;font-family:Segoe UI,Arial,sans-serif"><title id="title-2">QA graph (LangGraph)</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="990" height="1685" fill="white"/><text x="32" y="35" fill="#0f172a" font-size="22" font-weight="700">QA graph (LangGraph)</text><text x="32" y="60" fill="#475569" font-size="13">Green: ingestion | Blue: search | Purple: agents | Orange: interfaces / output</text><path data-from="START" data-to="pq" d="M390.0,168.0 C390.0,223.75 390.0,223.75 390.0,279.5" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><path data-from="pq" data-to="rt" d="M390.0,360.5 C390.0,416.25 390.0,416.25 390.0,472.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><circle cx="390.0" cy="416.25" r="12" fill="#fff" stroke="#334155"/><text x="390.0" y="420.25" text-anchor="middle" font-size="12" fill="#0f172a">1</text><path data-from="rt" data-to="ans" d="M390.0,548.0 C390.0,605.0 390.0,605.0 390.0,662.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><path data-from="ans" data-to="chk" d="M390.0,738.0 C390.0,795.0 390.0,795.0 390.0,852.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><path data-from="chk" data-to="rb" d="M390.0,928.0 C390.0,985.0 390.0,985.0 390.0,1042.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><circle cx="390.0" cy="985.0" r="12" fill="#fff" stroke="#334155"/><text x="390.0" y="989.0" text-anchor="middle" font-size="12" fill="#0f172a">2</text><path data-from="rb" data-to="ans" d="M255.0,1080 H85 V700 H255.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><path data-from="chk" data-to="END" d="M390.0,928.0 V953.0 H800 V1207.0 H390.0 V1232.0" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><circle cx="800" cy="1080.0" r="12" fill="#fff" stroke="#334155"/><text x="800" y="1084.0" text-anchor="middle" font-size="12" fill="#0f172a">3</text><g data-node="START"><title>start</title><rect x="255.0" y="92.0" width="270" height="76" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/><text x="390.0" y="135.0" text-anchor="middle" font-size="14" fill="#172033">start</text></g><g data-node="pq"><title>plan_question Planner: intent, bids, filtered sub-queries</title><rect x="255.0" y="279.5" width="270" height="81" rx="12" fill="#faf5ff" stroke="#7e22ce" stroke-width="1.5"/><text x="390.0" y="306.0" text-anchor="middle" font-size="14" fill="#172033">plan_question</text><text x="390.0" y="325.0" text-anchor="middle" font-size="14" fill="#172033">Planner: intent, bids,</text><text x="390.0" y="344.0" text-anchor="middle" font-size="14" fill="#172033">filtered sub-queries</text></g><g data-node="rt"><title>retrieve Retrieval Agent</title><rect x="255.0" y="472.0" width="270" height="76" rx="12" fill="#faf5ff" stroke="#7e22ce" stroke-width="1.5"/><text x="390.0" y="505.5" text-anchor="middle" font-size="14" fill="#172033">retrieve</text><text x="390.0" y="524.5" text-anchor="middle" font-size="14" fill="#172033">Retrieval Agent</text></g><g data-node="ans"><title>answer Q&amp;A Agent</title><rect x="255.0" y="662.0" width="270" height="76" rx="12" fill="#faf5ff" stroke="#7e22ce" stroke-width="1.5"/><text x="390.0" y="695.5" text-anchor="middle" font-size="14" fill="#172033">answer</text><text x="390.0" y="714.5" text-anchor="middle" font-size="14" fill="#172033">Q&amp;A Agent</text></g><g data-node="chk"><title>check citations + grounding</title><rect x="255.0" y="852.0" width="270" height="76" rx="12" fill="#faf5ff" stroke="#7e22ce" stroke-width="1.5"/><text x="390.0" y="885.5" text-anchor="middle" font-size="14" fill="#172033">check</text><text x="390.0" y="904.5" text-anchor="middle" font-size="14" fill="#172033">citations + grounding</text></g><g data-node="rb"><title>retrieve_broad LLM rewrites, relaxed filters</title><rect x="255.0" y="1042.0" width="270" height="76" rx="12" fill="#faf5ff" stroke="#7e22ce" stroke-width="1.5"/><text x="390.0" y="1075.5" text-anchor="middle" font-size="14" fill="#172033">retrieve_broad</text><text x="390.0" y="1094.5" text-anchor="middle" font-size="14" fill="#172033">LLM rewrites, relaxed filters</text></g><g data-node="END"><title>end</title><rect x="255.0" y="1232.0" width="270" height="76" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/><text x="390.0" y="1275.0" text-anchor="middle" font-size="14" fill="#172033">end</text></g><text x="32" y="1460" fill="#334155" font-size="14">1. plan_question → retrieve: Send per sub-query (parallel)</text><text x="32" y="1515" fill="#334155" font-size="14">2. check → retrieve_broad: not grounded, 1 retry</text><text x="32" y="1570" fill="#334155" font-size="14">3. check → end: ok</text></svg>